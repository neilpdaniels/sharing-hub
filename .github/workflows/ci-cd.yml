name: ci-cd

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  DEPLOY_PATH: /srv/rentalution

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Django checks
        env:
          DJANGO_SETTINGS_MODULE: rentalution.settings.test
          RENTALUTION_SECRET_KEY: ci-check-secret-key
          DJANGO_SECRET_KEY: ci-check-secret-key
        run: uv run python manage.py check

      - name: Run Flake8
        run: uv run flake8

      - name: Check for hardcoded config values
        run: sh scripts/check_hardcoded_config.sh

  build_and_push:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keep BuildKit layers in GHCR alongside the application image. This
          # avoids reinstalling system and Python dependencies on every run.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build_and_push
    runs-on: ubuntu-latest
    environment: rentalution
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy Nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/nginx/rentalution.conf
          target: /tmp/rentalution-nginx

      - name: Copy Compose configuration to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.yml,docker-compose.prod.yml,monitoring
          target: /tmp/rentalution-compose

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The image pull plus the bounded Celery readiness retry can exceed
          # ssh-action's implicit 10-minute command timeout.
          command_timeout: 20m
          debug: true
          script: |
            set -e
            deploy_started_epoch="$(date +%s)"
            stage() {
              stage_now_epoch="$(date +%s)"
              printf '[%s] [+%ss] Deploy stage: %s\n' "$(date -Is)" "$((stage_now_epoch - deploy_started_epoch))" "$1"
            }
            cd "${{ env.DEPLOY_PATH }}"
            stage 'install Compose and monitoring configuration'
            install -m 0644 /tmp/rentalution-compose/docker-compose.yml docker-compose.yml
            install -m 0644 /tmp/rentalution-compose/docker-compose.prod.yml docker-compose.prod.yml
            sudo install -d -m 0755 monitoring
            sudo cp -R /tmp/rentalution-compose/monitoring/. monitoring/
            export WEB_IMAGE="${{ env.IMAGE_NAME }}:latest"
            stage 'authenticate to GHCR'
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            # The application image is already built and cached in GHCR. Pull
            # only that image; pulling every unchanged monitoring image makes
            # each deployment unnecessarily slow.
            stage 'pull application image'
            docker pull "$WEB_IMAGE"
            # The application image now runs as UID/GID 10001, including Celery.
            # These bind mounts must remain writable after that privilege drop.
            stage 'prepare persistent application directories'
            sudo install -d -m 0755 media staticfiles
            sudo chown -R 10001:10001 media staticfiles
            stage 'validate production environment'
            docker compose -f docker-compose.prod.yml run --rm --no-deps web sh scripts/check_prod_env.sh
            stage 'start application containers'
            docker compose -f docker-compose.prod.yml up -d
            # Grafana, Loki, Alloy, and the watchdog load configuration from
            # bind-mounted files. Compose does not recreate them merely because
            # those host files changed, so restart them explicitly after each
            # deployment to apply provisioning/configuration updates.
            stage 'reload observability containers'
            docker compose -f docker-compose.prod.yml up -d --force-recreate loki alloy grafana container-watchdog
            stage 'wait for required containers'
            for attempt in $(seq 1 30); do
              running_services="$(docker compose -f docker-compose.prod.yml ps --status running --services)"
              missing_services=""
              for service in web db redis worker video-worker catalog-ai-worker beat flower container-watchdog loki alloy grafana uptime-kuma; do
                echo "$running_services" | grep -qx "$service" || missing_services="$missing_services $service"
              done
              if [ -z "$missing_services" ]; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Services failed to remain running:$missing_services" >&2
                docker compose -f docker-compose.prod.yml ps
                docker compose -f docker-compose.prod.yml logs --tail=100 worker video-worker catalog-ai-worker beat flower container-watchdog loki alloy grafana uptime-kuma
                exit 1
              fi
              sleep 2
            done
            stage 'verify Celery workers'
            celery_ready=0
            worker_ping=""
            worker_name="worker@$(docker compose -f docker-compose.prod.yml exec -T worker hostname)"
            video_worker_name="video-worker@$(docker compose -f docker-compose.prod.yml exec -T video-worker hostname)"
            catalog_ai_worker_name="catalog-ai-worker@$(docker compose -f docker-compose.prod.yml exec -T catalog-ai-worker hostname)"
            for attempt in $(seq 1 30); do
              if worker_ping="$(docker compose -f docker-compose.prod.yml exec -T worker sh scripts/check_celery_runtime.sh "$worker_name" "$video_worker_name" "$catalog_ai_worker_name" 2>&1)"; then
                celery_ready=1
                break
              fi
              printf '[%s] Celery probe attempt %s/30 did not pass\n' "$(date -Is)" "$attempt" >&2
              printf 'worker probe: %s\n' "$worker_ping" >&2
              sleep 2
            done
            if [ "$celery_ready" -ne 1 ]; then
              echo "Celery workers did not respond to ping within 60 seconds." >&2
              echo "worker probe:" >&2
              printf '%s\n' "$worker_ping" >&2
              docker compose -f docker-compose.prod.yml logs --tail=100 worker video-worker catalog-ai-worker
              exit 1
            fi
            stage 'verify Flower'
            docker compose -f docker-compose.prod.yml exec -T flower python -c '
            from urllib.error import HTTPError
            from urllib.request import urlopen

            try:
                urlopen("http://127.0.0.1:5555/", timeout=5)
            except HTTPError as error:
                if error.code != 401:
                    raise
            '
            stage 'install Nginx configuration'
            sudo install -m 0644 /tmp/rentalution-nginx/deploy/nginx/rentalution.conf /etc/nginx/sites-available/rentalution
            # Ubuntu's stock Nginx site also owns the default port-80 virtual
            # host. Rentalution intentionally supplies the default vhosts to
            # reject unknown Host headers before Django sees them.
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo ln -sfn /etc/nginx/sites-available/rentalution /etc/nginx/sites-enabled/rentalution
            stage 'renew or issue TLS certificate'
            sudo certbot --nginx -d rentalution.co.uk -d www.rentalution.co.uk --non-interactive --agree-tos --redirect --keep-until-expiring -m "${{ secrets.CERTBOT_EMAIL }}"
            stage 'validate and reload Nginx'
            sudo nginx -t
            sudo systemctl reload nginx
            stage 'deployment complete'
