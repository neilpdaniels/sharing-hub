name: ci-cd

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  DEPLOY_PATH: /srv/rentalution

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Django checks
        env:
          DJANGO_SETTINGS_MODULE: rentalution.settings.local
          RENTALUTION_SECRET_KEY: ci-check-secret-key
          DJANGO_SECRET_KEY: ci-check-secret-key
        run: uv run python manage.py check

      - name: Check for hardcoded config values
        run: sh scripts/check_hardcoded_config.sh

  build_and_push:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build_and_push
    runs-on: ubuntu-latest
    environment: rentalution
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy Nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/nginx/rentalution.conf
          target: /tmp/rentalution-nginx

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ env.DEPLOY_PATH }}"
            export WEB_IMAGE="${{ env.IMAGE_NAME }}:latest"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker system prune -af
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps web sh scripts/check_prod_env.sh
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            for attempt in $(seq 1 30); do
              running_services="$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps --status running --services)"
              missing_services=""
              for service in web db redis worker video-worker beat flower; do
                echo "$running_services" | grep -qx "$service" || missing_services="$missing_services $service"
              done
              if [ -z "$missing_services" ]; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Services failed to remain running:$missing_services" >&2
                docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
                docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=100 worker video-worker beat flower
                exit 1
              fi
              sleep 2
            done
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T worker sh scripts/check_celery_runtime.sh
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T video-worker sh -c 'sh scripts/check_celery_runtime.sh "video-worker@$(hostname)"'
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T flower uv run python -c '
            from urllib.error import HTTPError
            from urllib.request import urlopen

            try:
                urlopen("http://127.0.0.1:5555/", timeout=5)
            except HTTPError as error:
                if error.code != 401:
                    raise
            '
            sudo install -m 0644 /tmp/rentalution-nginx/deploy/nginx/rentalution.conf /etc/nginx/sites-available/rentalution
            sudo ln -sfn /etc/nginx/sites-available/rentalution /etc/nginx/sites-enabled/rentalution
            sudo certbot --nginx -d rentalution.co.uk -d www.rentalution.co.uk --non-interactive --agree-tos --redirect --keep-until-expiring -m "${{ secrets.CERTBOT_EMAIL }}"
            sudo nginx -t
            sudo systemctl reload nginx
