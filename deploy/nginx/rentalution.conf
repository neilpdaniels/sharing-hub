server {
    listen 80;
    server_name rentalution.com www.rentalution.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name rentalution.com www.rentalution.com;

    ssl_certificate /etc/letsencrypt/live/rentalution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rentalution.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20M;

    location /static/ {
        alias /srv/rentalution/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/rentalution/media/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 120;
        proxy_connect_timeout 120;
        proxy_send_timeout 120;
    }
}
