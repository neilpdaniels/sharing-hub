server {
    listen 80;
    server_name rentalution.co.uk www.rentalution.co.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://rentalution.co.uk$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name rentalution.co.uk;

    # Trust CF-Connecting-IP only when the TCP peer is one of Cloudflare's
    # published proxy networks. This restores the actual visitor IP before it
    # is passed to Django as X-Real-IP for abuse controls.
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Listing photos are resized in the browser and condition videos are
    # compressed before upload.  The previous nginx default (1 MB) rejected
    # those requests with a 413 before Django could receive them.
    client_max_body_size 55m;
    client_body_timeout 300s;

    ssl_certificate /etc/letsencrypt/live/rentalution.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rentalution.co.uk/privkey.pem;

    location /static/ {
        alias /srv/rentalution/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/rentalution/media/;
        expires 30d;
        access_log off;
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # Apple and Android retrieve these without a user session.  Keep them
    # public even while the preview site is protected by HTTP basic auth.
    location = /.well-known/apple-app-site-association {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /.well-known/assetlinks.json {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Stripe must be able to redirect a lender here after Express onboarding;
    # the Flutter app claims this verified HTTPS URL when installed.
    location = /app/payouts/return/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}

server {
    listen 443 ssl http2;
    server_name www.rentalution.co.uk;

    ssl_certificate /etc/letsencrypt/live/rentalution.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rentalution.co.uk/privkey.pem;

    return 301 https://rentalution.co.uk$request_uri;
}
