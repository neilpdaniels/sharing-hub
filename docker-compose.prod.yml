services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentalution}
      POSTGRES_USER: ${POSTGRES_USER:-rentalution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE}
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run python manage.py collectstatic --noinput &&
             uv run gunicorn rentalution.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    env_file:
      - .env
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    depends_on:
      - db
      - redis
    ports:
      # Public traffic must pass through host Nginx, which supplies the trusted
      # X-Real-IP used by abuse controls. Do not expose Gunicorn directly.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  video-worker:
    image: ${WEB_IMAGE}
    command: uv run celery -A rentalution worker -Q video --loglevel=info --autoscale=2,1 --hostname=video-worker@%h
    env_file:
      - .env
    volumes:
      - ./media:/app/media
    depends_on:
      - db
      - web
      - redis
    restart: unless-stopped

  # Kept separate from transaction/video processing because LLM and image work
  # is slow, rate-limited and paid. One task at a time is intentional.
  catalog-ai-worker:
    image: ${WEB_IMAGE}
    command: uv run celery -A rentalution worker -Q catalog_ai --loglevel=info --concurrency=1 --hostname=catalog-ai-worker@%h
    env_file:
      - .env
    volumes:
      - ./media:/app/media
    depends_on:
      - db
      - redis
    restart: unless-stopped


  worker:
    image: ${WEB_IMAGE}
    command: uv run celery -A rentalution worker -Q celery --loglevel=info --autoscale=4,1 --hostname=worker@%h
    env_file:
      - .env
    volumes:
      - ./media:/app/media
    depends_on:
      - db
      - redis
    restart: unless-stopped

  beat:
    image: ${WEB_IMAGE}
    command: uv run celery -A rentalution beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule
    env_file:
      - .env
    volumes:
      - celery_beat_data:/var/lib/celery
    depends_on:
      - db
      - redis
    restart: unless-stopped

  flower:
    image: ${WEB_IMAGE}
    command: uv run celery -A rentalution flower --address=0.0.0.0 --port=5555 --basic_auth=${FLOWER_BASIC_AUTH}
    env_file:
      - .env
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis
    restart: unless-stopped

  # Private observability services. Access Grafana and Uptime Kuma through an
  # SSH tunnel; no monitoring UI is exposed to the public internet.
  loki:
    image: grafana/loki:3.7.8
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    command: run --disable-reporting --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log/nginx:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${EMAIL_HOST:-smtp.zoho.com}:${EMAIL_PORT:-587}
      GF_SMTP_USER: ${EMAIL_HOST_USER:-application@rentalution.co.uk}
      GF_SMTP_PASSWORD: ${APP_EMAIL_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${DEFAULT_FROM_EMAIL:-application@rentalution.co.uk}
      GF_SMTP_FROM_NAME: Rentalution monitoring
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      # Referenced by the provisioned Grafana e-mail contact point.
      MONITORING_ALERT_EMAIL: ${MONITORING_ALERT_EMAIL}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
volumes:
  postgres_data:
  celery_beat_data:
  loki_data:
  alloy_data:
  grafana_data:
  uptime_kuma_data:
