services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentalution}
      POSTGRES_USER: ${POSTGRES_USER:-rentalution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE}
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run python manage.py collectstatic --noinput &&
             uv run gunicorn rentalution.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    env_file:
      - .env
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    depends_on:
      - db
      - redis
    ports:
      # Public traffic must pass through host Nginx, which supplies the trusted
      # X-Real-IP used by abuse controls. Do not expose Gunicorn directly.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  video-worker:
    image: ${WEB_IMAGE}
    command: uv run celery -A rentalution worker -Q video --loglevel=info --autoscale=2,1 --hostname=video-worker@%h
    env_file:
      - .env
    volumes:
      - ./media:/app/media
    depends_on:
      - db
      - web
      - redis
    restart: unless-stopped

  # Kept separate from transaction/video processing because LLM and image work
  # is slow, rate-limited and paid. One task at a time is intentional.
  catalog-ai-worker:
    image: ${WEB_IMAGE}
    command: uv run celery -A rentalution worker -Q catalog_ai --loglevel=info --concurrency=1 --hostname=catalog-ai-worker@%h
    env_file:
      - .env
    volumes:
      - ./media:/app/media
    depends_on:
      - db
      - redis
    restart: unless-stopped


  worker:
    image: ${WEB_IMAGE}
    command: uv run celery -A rentalution worker -Q celery --loglevel=info --autoscale=4,1 --hostname=worker@%h
    env_file:
      - .env
    volumes:
      - ./media:/app/media
    depends_on:
      - db
      - redis
    restart: unless-stopped

  beat:
    image: ${WEB_IMAGE}
    command: uv run celery -A rentalution beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule
    env_file:
      - .env
    volumes:
      - celery_beat_data:/var/lib/celery
    depends_on:
      - db
      - redis
    restart: unless-stopped

  flower:
    image: ${WEB_IMAGE}
    command: uv run celery -A rentalution flower --address=0.0.0.0 --port=5555 --basic_auth=${FLOWER_BASIC_AUTH}
    env_file:
      - .env
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis
    restart: unless-stopped
volumes:
  postgres_data:
  celery_beat_data:
