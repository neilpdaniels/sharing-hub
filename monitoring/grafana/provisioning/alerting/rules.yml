apiVersion: 1

groups:
  - orgId: 1
    name: Rentalution critical logs
    folder: Rentalution
    interval: 1m
    rules:
      - uid: rentalution_container_not_running
        title: Rentalution container stopped or restarting
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: A required Rentalution container is stopped or restarting.
          description: Check Docker Compose status and the container's logs on the VPS.
        labels:
          severity: critical
          service: container-runtime
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum(count_over_time({job="docker"} |~ "CONTAINER_WATCHDOG_(NOT_RUNNING|RESTARTED)" [2m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

      - uid: rentalution_stripe_webhook_failures
        title: Stripe webhook delivery is failing
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: Stripe received a non-success response from the Connect webhook.
          description: Check Nginx access logs and the Django web container. Stripe retries failed deliveries, but action is required.
        labels:
          severity: critical
          service: stripe-webhook
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum(count_over_time({job="nginx-access"} |= "/transaction/stripe/connect/webhook/" |~ "\\\" (4|5)[0-9]{2} " [5m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

      - uid: rentalution_application_critical_errors
        title: Repeated application critical errors
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: Three or more critical application log entries appeared in five minutes.
          description: Inspect the Rentalution operations dashboard and the relevant container logs.
        labels:
          severity: critical
          service: application
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum(count_over_time({job="docker"} |~ "(?i)(traceback|critical|exception|permissionerror|celerybeat-schedule)" [5m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [2]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
