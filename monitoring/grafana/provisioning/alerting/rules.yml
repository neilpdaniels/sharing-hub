apiVersion: 1

groups:
  - orgId: 1
    name: Rentalution critical logs
    folder: Rentalution
    interval: 1m
    rules:
      - uid: rentalution_container_not_running
        title: Rentalution container stopped or restarting
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: A required Rentalution container is stopped or restarting.
          description: Check Docker Compose status and the container's logs on the VPS.
          event_count: '{{ printf "%.0f" $values.B.Value }}'
          __dashboardUid__: rentalution-operations
          __panelId__: '6'
        labels:
          severity: critical
          service: container-runtime
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum(count_over_time({job="docker", service="container-watchdog"} |~ "CONTAINER_WATCHDOG_(NOT_RUNNING|RESTARTED)" [2m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

      - uid: rentalution_stripe_webhook_failures
        title: Stripe webhook server failure
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: Stripe received a 5xx response from the Connect webhook.
          description: Check Nginx access logs and the Django web container immediately. Stripe retries failed deliveries, but action is required.
          event_count: '{{ printf "%.0f" $values.B.Value }}'
          __dashboardUid__: rentalution-operations
          __panelId__: '4'
        labels:
          severity: critical
          service: stripe-webhook
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum(count_over_time({job="nginx-access"} |= "/transaction/stripe/connect/webhook/" |~ " 5[0-9]{2} " [5m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

      - uid: rentalution_application_critical_errors
        title: Application high-confidence critical failure
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: A high-confidence application critical failure was logged.
          description: Inspect the Rentalution operations dashboard and the relevant container logs immediately.
          event_count: '{{ printf "%.0f" $values.B.Value }}'
          # log_excerpt is a query-time label, not an indexed Loki label. A
          # leading timestamp is removed before grouping so repeated errors
          # remain one series rather than becoming a new series each second.
          # The excerpt is capped at 500 characters before being sent to the
          # restricted Discord alert channel.
          log_excerpt: '{{ $labels.log_excerpt }}'
          __dashboardUid__: rentalution-operations
          __panelId__: '5'
        labels:
          severity: critical
          service: application
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'topk(10, sum by (log_excerpt) (count_over_time({job="docker", service=~"web|worker|video-worker|catalog-ai-worker|beat"} |~ "(?i)(\\bcritical\\b|\\bfatal\\b|\\bpanic\\b|out of memory|no space left|database.*(unavailable|corrupt)|could not connect to.*(database|redis)|(stripe|payment).*(webhook|signature).*(failed|error))" | regexp "^(?P<timestamp>[0-9]{4}-[0-9]{2}-[0-9]{2}[ T][0-9:.+-]+[[:space:]]+)?(?P<log_excerpt>.{1,500})" [5m)))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
