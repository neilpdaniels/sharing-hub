{% extends "admin/change_list.html" %}

{% block object-tools-items %}
  <li>
    <a href="{% url 'admin:navigation_cataloguecleanupreview_changelist' %}">Combined product + taxonomy cleanup</a>
  </li>
  <li>
    <form method="post" action="{% url 'admin:navigation_categorytaxonomyreview_run_now' %}" style="display:inline">
      {% csrf_token %}
      <label for="taxonomy-review-strength" class="visually-hidden">Review strength</label>
      <select id="taxonomy-review-strength" name="review_strength" aria-label="Review strength">
        <option value="LIGHT">Light</option>
        <option value="MEDIUM" selected>Medium</option>
        <option value="HEAVY">Heavy</option>
      </select>
      <label for="taxonomy-review-scope" class="visually-hidden">Category scope</label>
      <select id="taxonomy-review-scope" name="scope_category_id" aria-label="Category scope">
        <option value="">Whole catalogue</option>
        {% for category in taxonomy_scope_categories %}
          <option value="{{ category.id }}">{{ category.title }}</option>
        {% endfor %}
      </select>
      <button type="submit" class="addlink" style="border:0; cursor:pointer">Run taxonomy review</button>
    </form>
  </li>
  {{ block.super }}
{% endblock %}
