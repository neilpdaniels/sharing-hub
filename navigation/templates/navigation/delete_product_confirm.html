{% extends "base.html" %}
{% load static %}

{% block title %}Delete {{ product.name|title }}{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-body p-4">
          <h1 class="h3 mb-3">Delete product</h1>
          <p class="text-muted mb-4">
            You are about to delete <strong>{{ product.name }}</strong>.
          </p>
          <p class="mb-4">
            Category: <strong>{{ product.category_id.title }}</strong>
          </p>
          <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-danger">Delete product</button>
              <a href="{% url 'navigation:productPage' product.slug %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
